{% extends "base.html" %}

{% block title %}Artifacts - AppHub{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1>Artifacts</h1>
        <p class="subtitle">Download and manage built application binaries</p>
    </div>
</div>

<!-- Filters -->
<div class="filters">
    <div class="filter-group search-group">
        <input type="text" id="search-input" placeholder="Search artifacts..." onkeyup="handleSearch(event)">
        <button class="btn btn-secondary" onclick="loadArtifacts()">
            <i class="fas fa-search"></i>
        </button>
    </div>
</div>

<!-- Artifacts Grid -->
<div class="artifacts-container" id="artifacts-container">
    <div class="loading-spinner centered"></div>
</div>

<!-- Pagination -->
<div class="pagination" id="pagination">
    <!-- Pagination will be inserted here -->
</div>
{% endblock %}

{% block scripts %}
<script>
let currentPage = 0;
const pageSize = 20;

document.addEventListener('DOMContentLoaded', function() {
    loadArtifacts();
});

async function loadArtifacts() {
    const searchQuery = document.getElementById('search-input').value;
    
    try {
        const response = await fetch(`/api/artifacts?skip=${currentPage * pageSize}&limit=${pageSize}`);
        const artifacts = await response.json();
        
        const container = document.getElementById('artifacts-container');
        
        if (artifacts.length === 0 && currentPage === 0) {
            container.innerHTML = `
                <div class="empty-state large">
                    <i class="fas fa-box-archive"></i>
                    <h3>No Artifacts Yet</h3>
                    <p>Artifacts will appear here after successful builds</p>
                    <a href="/builds/new" class="btn btn-primary">Create New Build</a>
                </div>
            `;
            document.getElementById('pagination').innerHTML = '';
            return;
        }
        
        container.innerHTML = artifacts.map(artifact => `
            <div class="artifact-card-large">
                <div class="artifact-header">
                    <div class="artifact-icon-large">
                        <i class="fas fa-file-archive"></i>
                    </div>
                    <div class="artifact-title">
                        <h3>${escapeHtml(artifact.name)}</h3>
                        <span class="artifact-filename">${escapeHtml(artifact.filename)}</span>
                    </div>
                </div>
                <div class="artifact-body">
                    <div class="artifact-meta-grid">
                        <div class="meta-item">
                            <span class="meta-label">Build</span>
                            <span class="meta-value">#${artifact.build_job_id}</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">Size</span>
                            <span class="meta-value">${formatFileSize(artifact.file_size)}</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">Platform</span>
                            <span class="meta-value">${artifact.platform || 'N/A'}</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">Architecture</span>
                            <span class="meta-value">${artifact.architecture || 'N/A'}</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">Version</span>
                            <span class="meta-value">${artifact.version || 'N/A'}</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">Downloads</span>
                            <span class="meta-value">${artifact.download_count}</span>
                        </div>
                    </div>
                    <div class="artifact-date">
                        <i class="fas fa-calendar"></i> Created ${formatDate(artifact.created_at)}
                    </div>
                </div>
                <div class="artifact-actions">
                    <a href="/api/artifacts/${artifact.id}/download" class="btn btn-primary">
                        <i class="fas fa-download"></i> Download
                    </a>
                    <a href="/builds/${artifact.build_job_id}" class="btn btn-secondary">
                        <i class="fas fa-eye"></i> View Build
                    </a>
                    <button class="btn btn-danger" onclick="deleteArtifact(${artifact.id})">
                        <i class="fas fa-trash"></i> Delete
                    </button>
                </div>
            </div>
        `).join('');
        
        renderPagination(artifacts.length === pageSize);
    } catch (error) {
        console.error(error);
        showToast('Failed to load artifacts', 'error');
    }
}

function renderPagination(hasMore) {
    const container = document.getElementById('pagination');
    
    if (currentPage === 0 && !hasMore) {
        container.innerHTML = '';
        return;
    }
    
    let html = `
        <button class="btn btn-secondary" ${currentPage === 0 ? 'disabled' : ''} onclick="goToPage(${currentPage - 1})">
            <i class="fas fa-chevron-left"></i> Previous
        </button>
        <span class="page-info">Page ${currentPage + 1}</span>
        <button class="btn btn-secondary" ${!hasMore ? 'disabled' : ''} onclick="goToPage(${currentPage + 1})">
            Next <i class="fas fa-chevron-right"></i>
        </button>
    `;
    
    container.innerHTML = html;
}

function goToPage(page) {
    currentPage = page;
    loadArtifacts();
    window.scrollTo(0, 0);
}

function handleSearch(event) {
    if (event.key === 'Enter') {
        currentPage = 0;
        loadArtifacts();
    }
}

async function deleteArtifact(artifactId) {
    if (!confirm('Are you sure you want to delete this artifact?')) return;
    
    try {
        const response = await fetch(`/api/artifacts/${artifactId}`, {
            method: 'DELETE'
        });
        
        if (response.ok) {
            showToast('Artifact deleted', 'success');
            loadArtifacts();
        } else {
            const error = await response.json();
            showToast(error.detail || 'Failed to delete artifact', 'error');
        }
    } catch (error) {
        showToast('Failed to delete artifact', 'error');
    }
}
</script>
{% endblock %}
