<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AppHub{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <i class="fas fa-cube"></i>
                <span>AppHub</span>
            </div>
            <nav class="sidebar-nav">
                <a href="/" class="nav-item {% if request.url.path == '/' %}active{% endif %}">
                    <i class="fas fa-home"></i>
                    <span>Dashboard</span>
                </a>
                <a href="/builds" class="nav-item {% if '/builds' in request.url.path %}active{% endif %}">
                    <i class="fas fa-hammer"></i>
                    <span>Builds</span>
                </a>
                <a href="/agents" class="nav-item {% if request.url.path == '/agents' %}active{% endif %}">
                    <i class="fas fa-robot"></i>
                    <span>AI Agents</span>
                </a>
                <a href="/artifacts" class="nav-item {% if request.url.path == '/artifacts' %}active{% endif %}">
                    <i class="fas fa-box-archive"></i>
                    <span>Artifacts</span>
                </a>
                <a href="/settings" class="nav-item {% if request.url.path == '/settings' %}active{% endif %}">
                    <i class="fas fa-cog"></i>
                    <span>Settings</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <script src="/static/js/app.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
